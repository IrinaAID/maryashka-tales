

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все сказки — Мышка Марьяшка</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #fdfaf5;
      font-family: 'Nunito', sans-serif;
      color: #5a4a42;
    }

    .header-font {
      font-family: 'Pacifico', cursive;
    }

    .mouse-card {
      background: white;
      border-radius: 20px;
      transition: transform 0.2s;
      border: 1px solid #eee5d8;
    }

    .mouse-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(90, 74, 66, 0.05);
    }
  </style>
</head>

<body>

  <header class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <h1 class="text-4xl font-extrabold text-[#6b584e]">
        🌿 Все сказки Марьяшки
      </h1>

      <a href="index.html"
         class="inline-block bg-white border border-[#eee5d8] text-[#6b584e] px-5 py-2 rounded-full font-semibold hover:bg-[#fdf7f0] transition">
        ← На главную
      </a>
    </div>

    <p class="mt-4 text-lg text-gray-600">
      Добрые и волшебные истории о дружбе, смелости и маленьких чудесах ✨
    </p>
  </header>

  <main class="max-w-7xl mx-auto px-6 pb-12">
    <div id="storiesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <script>
    const stories = [
      {
        title: "Сказка 1. Мышка Марьяшка и Таинственные следы",
        image: "cover_story1.png",
        link: "https://youtu.be/YcPZwRg-a98",
        description: "В зимнем лесу появляются странные следы, которые будто бегут сами по себе. Марьяшка и её друзья решают расследовать загадку 😄✨"
      },
      {
        title: "Сказка 2. Мышка Марьяшка и Хрустальные часы времени",
        image: "cover_story2.png",
        link: "https://youtu.be/TKTucNive2c",
        description: "В самой чаще Заповедного леса темный маг похищает Хрустальные Часы Времени, чтобы стереть из истории всё доброе и светлое."
      },
      {
        title: "Сказка 3. Мышка Марьяшка и Хорошее настроение",
        image: "cover_story3.png",
        link: "https://youtu.be/09x507jwJiQ",
        description: "Это добрая история о том, как улыбка, дружба и маленькие радости могут изменить день."
      },
      {
        title: "Сказка 4. Название сказки",
        image: "cover_story4.png",
        link: "#",
        description: "Короткое описание четвёртой сказки."
      }
    ];

    const grid = document.getElementById("storiesGrid");

    stories.forEach(item => {
      const card = document.createElement("div");
      card.className = "mouse-card p-6 flex flex-col h-full";

      card.innerHTML = `
        <a href="${item.link}" target="_blank" class="group relative block">
          <div class="aspect-video bg-gray-100 rounded-xl mb-4 overflow-hidden border border-[#eee5d8]">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition duration-300">
              <span class="text-white text-3xl">▶</span>
            </div>
          </div>
        </a>

        <h2 class="font-bold text-lg mb-2 text-[#6b584e]">
          ${item.title}
        </h2>

        <p class="text-sm text-gray-500 leading-relaxed">
          ${item.description}
        </p>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
