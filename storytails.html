<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все сказки — Мышка Марьяшка</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to bottom, #fffaf5, #f0fdf4);
    }
  </style>
</head>

<body class="text-gray-800">

  <!-- HEADER -->
  <header class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

      <h1 class="text-4xl font-extrabold text-green-700">
        🌿 Все сказки Марьяшки
      </h1>

      <a href="index.html"
         class="inline-block bg-white border border-green-300 text-green-700 px-5 py-2 rounded-full font-semibold hover:bg-green-50 transition">
        ← На главную
      </a>

    </div>

    <p class="mt-4 text-lg text-gray-600">
      Добрые и волшебные истории о дружбе, смелости и маленьких чудесах ✨
    </p>
  </header>

  <!-- GRID -->
  <main class="max-w-7xl mx-auto px-6 pb-12">
    <div id="storiesGrid"
         class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    </div>
  </main>

  <!-- SCRIPT -->
  <script>
    const stories = [
      {
        title: "Сказка 1. Волшебный лес",
        image: "images/story1.jpg",
        link: "#",
        description: "История о том, как начинается каждое чудо."
      },
      {
        title: "Сказка 2. Потерянный лучик",
        image: "images/story2.jpg",
        link: "#",
        description: "Иногда свет нужно просто найти внутри себя."
      },
      {
        title: "Сказка 3. Тайна тихого озера",
        image: "images/story3.jpg",
        link: "#",
        description: "Там, где отражаются самые важные ответы."
      },
      {
        title: "Сказка 4. Дружба сильнее темноты",
        image: "images/story4.jpg",
        link: "#",
        description: "Когда рядом друзья — страх отступает."
      }
      // ➕ сюда добавляешь новые сказки
    ];

    const grid = document.getElementById("storiesGrid");

    stories.forEach(item => {
      const card = document.createElement("a");

      card.href = item.link;
      card.target = "_blank";

      card.className =
        "group bg-white rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition transform hover:-translate-y-1";

      card.innerHTML = `
        <div class="overflow-hidden">
          <img src="${item.image}" alt="${item.title}"
               class="w-full h-60 object-cover group-hover:scale-105 transition duration-300">
        </div>

        <div class="p-5">
          <h2 class="text-xl font-bold text-green-700 mb-2">
            ${item.title}
          </h2>
          <p class="text-gray-600 text-sm">
            ${item.description}
          </p>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
