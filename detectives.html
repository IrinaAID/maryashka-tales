<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Все детективы — Мышка Марьяшка</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(to bottom, #fffaf5, #fef3f2);
    }
  </style>
</head>
<body class="text-gray-800">

  <header class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <h1 class="text-4xl font-extrabold text-pink-700">Все детективы Марьяшки</h1>

      <a href="index.html"
         class="inline-block bg-white border border-pink-300 text-pink-700 px-5 py-2 rounded-full font-semibold hover:bg-pink-50 transition">
        ← На главную
      </a>
    </div>

    <p class="mt-4 text-lg text-gray-600">
      Здесь собраны все детективные истории, где Мышка Марьяшка - следопыт. 
      Каждая история — это доброе и увлекательное расследование. 
      Вместе со своими верными друзьями Марьяшка раскрывает необычные тайны, ищет ответы на загадки леса и помогает тем, кто попал в беду. 
    </p>
  </header>

  <main class="max-w-7xl mx-auto px-6 pb-12">
    <div id="detectivesGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <script>
    const detectives = [
      {
        title: "Дело №1. Украденный сыр Пармеджано Риджано",
        image: "cover1.jpg",
        link: "https://www.youtube.com/shorts/1xCnlnWB3Yw",
        description: "Первое расследование Марьяшки и знакомство с подозреваемыми."
      },
      {
        title: "Дело 2. Пропавший компас",
        image: "cover2.png",
        link: "https://youtube.com/shorts/Pv9OOUrErSI",
        description: "Марьяшка и её команда расследуют исчезновение компаса Барсука Бориса и находят его благодаря внимательности и смекалке."
      },
      {
        title: "Дело 3. Исчезнувшее эхо",
        image: "cover3.png",
        link: "https://www.youtube.com/shorts/kNIktzvgdA0",
        description: "Почему лес вдруг перестал отвечать?"
      },
      {
        title: "Дело 4. Тайна ночного колокольчика",
        image: "cover4_1.png",
        link: "https://youtube.com/shorts/r__RSF-g1Ic?feature=share",
        description: "Лунная нить оборвана, а колокольчик исчез."
      },
      {
        title: "Дело 5. Кто спрятал карту звёздного неба",
        image: "cover_case5.png",
        link: "https://youtube.com/shorts/aG1q2fvLyiA?feature=share#",
        description: "В Лесной Обсерватории исчезает самая важная вещь — карта звёздного неба ✨Без неё жители Заповедного леса не могут читать созвездия и понимать язык звёзд."
      },
      {
        title: "Дело 6. Секрет пустой кладовой",
        image: "cover_case6.png",
        link: "https://youtube.com/shorts/mo0Xd0DjBDo?feature=share",
        description: "В Заповедном лесу случается странное — кладовая оказывается совсем пустой. Ни орешков, ни ягод, ни припасов на зиму… 🧺 Мышка Марьяшка берётся за расследование. Следы на полу, забытый список, приоткрытая дверь — каждая деталь может быть подсказкой."
      }
      // сюда потом добавляешь остальные до 20
    ];

    const grid = document.getElementById("detectivesGrid");

    detectives.forEach(item => {
      const card = document.createElement("a");
      card.href = item.link;
      card.target = "_blank";
      card.className = "group bg-white rounded-3xl overflow-hidden shadow-md hover:shadow-xl transition transform hover:-translate-y-1";

      card.innerHTML = `
        <div class="overflow-hidden">
          <img src="${item.image}" alt="${item.title}" class="w-full h-60 object-cover group-hover:scale-105 transition duration-300">
        </div>
        <div class="p-5">
          <h2 class="text-xl font-bold text-pink-700 mb-2">${item.title}</h2>
          <p class="text-gray-600 text-sm">${item.description}</p>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
